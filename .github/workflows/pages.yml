name: Deploy course site to GitHub Pages

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Export Pages build environment
        shell: bash
        run: |
          echo "GITHUB_PAGES_BASE_PATH=${{ steps.pages.outputs.base_path }}" >> "$GITHUB_ENV"
          echo "SITE_URL=${{ steps.pages.outputs.base_url }}" >> "$GITHUB_ENV"

      - name: Validate content, types, and source
        run: pnpm run validate

      - name: Verify automatic Markdown discovery
        run: pnpm run test:discovery

      - name: Build final VitePress Pages artifact
        run: pnpm run build

      - name: Audit final Pages artifact
        run: pnpm run check:site

      - name: Install Chromium for navigation smoke test
        run: pnpm exec playwright install --with-deps chromium

      - name: Click through the final Pages artifact
        run: pnpm run test:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
