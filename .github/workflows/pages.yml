name: Deploy course site to GitHub Pages

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Export Pages build environment
        shell: bash
        run: |
          echo "GITHUB_PAGES_BASE_PATH=${{ steps.pages.outputs.base_path }}" >> "$GITHUB_ENV"
          echo "SITE_URL=${{ steps.pages.outputs.base_url }}" >> "$GITHUB_ENV"

      - name: Lint and typecheck
        run: |
          pnpm run lint
          pnpm run typecheck

      # 入库的判题内核产物必须与源码同步，否则学生 clone 到的是过期内核。
      - name: Confirm committed build artifacts are current
        run: |
          pnpm -r build
          git diff --exit-code -- packages

      - name: Install Chromium for the navigation smoke test
        run: pnpm exec playwright install --with-deps chromium

      # 一条命令覆盖内容校验、Lab 工具链、扩展、站点产物审计与浏览器冒烟。
      # VitePress 构建发生在 site-audit / site-e2e 的 globalSetup 里。
      - name: Run the site and tooling suite
        run: >
          pnpm exec vitest run
          --project unit --project lab-tools --project vscode
          --project content --project docs
          --project site-audit --project site-e2e --project discovery

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages

  lab-cpp:
    name: Lab C++ (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: GCC
            cxx: g++
          - os: ubuntu-latest
            label: Clang
            cxx: clang++
          - os: windows-latest
            label: MSVC
            cxx: cl
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install GNU Make for the Windows-first Make contract
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y

      - name: Verify Program and Project Golden Labs (Unix)
        if: runner.os != 'Windows'
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          pnpm lab doctor labs/chapter-01/exercise/E-01-01-sequential-list-deduplication
          pnpm exec vitest run --project lab-cpp

      # VsDevCmd.bat 改的是 shell 环境，必须由 cmd 继承给 vitest worker 再传到 cl 孙进程。
      - name: Verify Program and Project Golden Labs (MSVC)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_INSTALL=%%i"
          if not defined VS_INSTALL (
            echo No Visual Studio C++ toolchain was found by vswhere.
            exit /b 2
          )
          call "%VS_INSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64
          if errorlevel 1 exit /b %errorlevel%
          set CXX=cl
          pnpm lab doctor labs/chapter-01/exercise/E-01-01-sequential-list-deduplication
          pnpm exec vitest run --project lab-cpp

      - name: Confirm Lab builds do not modify tracked sources
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, lab-cpp]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
