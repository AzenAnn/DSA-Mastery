name: Deploy course site to GitHub Pages

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Export Pages build environment
        shell: bash
        run: |
          echo "GITHUB_PAGES_BASE_PATH=${{ steps.pages.outputs.base_path }}" >> "$GITHUB_ENV"
          echo "SITE_URL=${{ steps.pages.outputs.base_url }}" >> "$GITHUB_ENV"

      - name: Validate content, types, and source
        run: pnpm run validate

      - name: Test Lab schemas, scaffolding, comparators, and process limits
        run: pnpm run test:lab-tools

      - name: Validate Lab author-guide examples and entry points
        run: pnpm run test:lab-docs

      - name: Verify automatic Markdown discovery
        run: pnpm run test:discovery

      - name: Build final VitePress Pages artifact
        run: pnpm run build

      - name: Audit final Pages artifact
        run: pnpm run check:site

      - name: Install Chromium for navigation smoke test
        run: pnpm exec playwright install --with-deps chromium

      - name: Click through the final Pages artifact
        run: pnpm run test:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages

  lab-cpp:
    name: Lab C++ (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: GCC
            cxx: g++
          - os: ubuntu-latest
            label: Clang
            cxx: clang++
          - os: windows-latest
            label: MSVC
            cxx: cl
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install GNU Make for the Windows-first Make contract
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y

      - name: Verify Program and Project Golden Labs (Unix)
        if: runner.os != 'Windows'
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          pnpm lab:doctor -- labs/chapter-01/lab-01-06-sequential-list-deduplication
          pnpm run test:lab-golden
          pnpm run test:lab-make

      - name: Verify Program and Project Golden Labs (MSVC)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_INSTALL=%%i"
          if not defined VS_INSTALL (
            echo No Visual Studio C++ toolchain was found by vswhere.
            exit /b 2
          )
          call "%VS_INSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64
          if errorlevel 1 exit /b %errorlevel%
          set CXX=cl
          pnpm lab:doctor -- labs/chapter-01/lab-01-06-sequential-list-deduplication
          pnpm run test:lab-golden
          pnpm run test:lab-make

      - name: Confirm Lab builds do not modify tracked sources
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, lab-cpp]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
